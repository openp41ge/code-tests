# Tests a commit of openp41ge/code and reports the result back to it as the
# `code-tests` commit status (which the code repo's release gate requires).
#
# Triggered by the app's prerequisites workflow (repository_dispatch), by a
# maintainer (workflow_dispatch with a sha), or by a push here (tests the
# app's current master).
name: test

on:
  repository_dispatch:
    types: [test-app]
  workflow_dispatch:
    inputs:
      sha:
        description: openp41ge/code commit to test
        required: true
  push:
    branches: [master]

permissions:
  contents: read

env:
  NX_NO_CLOUD: "true"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

concurrency:
  group: test-${{ github.event.client_payload.sha || inputs.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.APP_CI_CLIENT_ID }}
          private-key: ${{ secrets.APP_CI_PRIVATE_KEY }}
          owner: openp41ge
          repositories: code
          permission-statuses: write # report the result

      - name: Resolve the app commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
        run: |
          SHA="$PAYLOAD_SHA"
          if [ -z "$SHA" ]; then
            SHA="$(gh api repos/openp41ge/code/commits/master --jq .sha)"
          fi
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      # Statuses stay generic: the public can see them, but not the tests.
      - name: Report pending
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api "repos/openp41ge/code/statuses/$SHA" \
            -f state=pending -f context=code-tests -f description=Running -f target_url="$RUN_URL"

      # The local layout: code-tests beside code/master (support/app.ts).
      - uses: actions/checkout@v4
        with:
          path: code-tests
      - uses: actions/checkout@v4
        with:
          repository: openp41ge/code
          ref: ${{ env.SHA }}
          path: code/master
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: code/master/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            code/master/pnpm-lock.yaml
            code-tests/pnpm-lock.yaml

      - name: Install and build the app
        working-directory: code/master
        run: |
          pnpm install --frozen-lockfile
          pnpm nx run-many -t build

      - name: Run the tests
        working-directory: code-tests
        env:
          APP_DIR: ${{ github.workspace }}/code/master
          # Tests make throwaway git repos; the runner has no git identity.
          GIT_AUTHOR_NAME: code-tests
          GIT_AUTHOR_EMAIL: code-tests@users.noreply.github.com
          GIT_COMMITTER_NAME: code-tests
          GIT_COMMITTER_EMAIL: code-tests@users.noreply.github.com
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Report the result
        if: always() && env.SHA != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUTCOME: ${{ job.status }}
        run: |
          case "$OUTCOME" in
            success) STATE=success; DESC=Passed ;;
            cancelled) STATE=error; DESC=Cancelled ;;
            *) STATE=failure; DESC=Failed ;;
          esac
          gh api "repos/openp41ge/code/statuses/$SHA" \
            -f state="$STATE" -f context=code-tests -f description="$DESC" -f target_url="$RUN_URL"
