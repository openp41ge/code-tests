<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Openp41ge — Syntax Highlighting Demo</title>
    <link rel="stylesheet" href="./src/demo-styles.css" />
  </head>
  <body>
    <div class="demo-root">
      <!-- Main panel area -->
      <div class="demo-main">
        <!-- Header -->
        <div class="demo-header">
          <span class="demo-icon">&prod;</span>
          <span>openp41ge</span>
          <span style="color: #555; font-weight: 400">— Syntax Highlighting</span>
        </div>

        <!-- Code display area -->
        <div class="demo-code-area" id="code-area">
          <div class="code-panel">
            <div class="code-toolbar">
              <span class="code-lang-label" id="lang-label">typescript</span>
              <div class="toolbar-actions">
                <span class="highlight-info" id="highlight-info">Initializing...</span>
              </div>
            </div>
            <div class="code-content" id="code-content">
              <div class="loading-overlay">Loading grammar engine...</div>
            </div>
          </div>
        </div>

        <!-- Console output -->
        <div class="demo-console">
          <div class="demo-console-header">
            <span>Console Log</span>
            <span style="margin-left: auto; color: #555; font-weight: 400; font-size: 10px">
              (highlighting timing)
            </span>
          </div>
          <div class="demo-console-body" id="console-body">
            <div class="log-entry">
              <span class="timestamp">[--:--:--]</span>Waiting for demo to initialize...
            </div>
          </div>
        </div>
      </div>

      <!-- Sidebar controls -->
      <div class="demo-sidebar">
        <h3>Theme</h3>
        <div class="demo-control-group" id="theme-buttons">
          <button class="demo-btn demo-btn--active" data-theme="openp41ge-dark">
            Openp41ge Dark
          </button>
          <button class="demo-btn" data-theme="openp41ge-light">Openp41ge Light</button>
        </div>

        <h3>Language</h3>
        <div class="demo-control-group" id="lang-buttons">
          <button class="demo-btn demo-btn--active" data-lang="typescript">TypeScript</button>
          <button class="demo-btn" data-lang="javascript">JavaScript</button>
          <button class="demo-btn" data-lang="rust">Rust</button>
          <button class="demo-btn" data-lang="python">Python</button>
          <button class="demo-btn" data-lang="go">Go</button>
          <button class="demo-btn" data-lang="html">HTML</button>
          <button class="demo-btn" data-lang="css">CSS</button>
          <button class="demo-btn" data-lang="json">JSON</button>
          <button class="demo-btn" data-lang="markdown">Markdown</button>
          <button class="demo-btn" data-lang="sql">SQL</button>
        </div>

        <hr style="border: none; border-top: 1px solid #2a2a2a; margin: 4px 0" />

        <div class="demo-control-group">
          <button class="demo-btn demo-btn--warning" id="btn-rehighlight">
            &#x21bb; Re-highlight
          </button>
        </div>

        <div style="margin-top: auto; padding-top: 12px; font-size: 10px; color: #444">
          Syntax Highlighting Demo v0.1
        </div>
      </div>
    </div>

    <script type="module" src="./src/demo-app.ts"></script>
  </body>
</html>
