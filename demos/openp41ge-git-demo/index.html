<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>openp41ge-git Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1e1e1e;
        color: #e0e0e0;
        padding: 24px;
      }
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
        color: #fff;
      }
      h2 {
        font-size: 18px;
        margin-bottom: 12px;
        color: #ccc;
        border-bottom: 1px solid #333;
        padding-bottom: 6px;
      }
      .subtitle {
        color: #888;
        font-size: 13px;
        margin-bottom: 24px;
      }
      .card {
        background: #2a2a2a;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
        border: 1px solid #333;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      input,
      select {
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid #444;
        background: #1e1e1e;
        color: #e0e0e0;
        font-size: 13px;
        flex: 1;
      }
      button {
        padding: 6px 14px;
        border-radius: 4px;
        border: none;
        background: #4a9eff;
        color: #fff;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.1s;
        white-space: nowrap;
      }
      button:hover {
        background: #3a8eef;
      }
      button.danger {
        background: #6c2020;
      }
      button.danger:hover {
        background: #8c3030;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        background: #333;
        color: #aaa;
      }
      .tag.success {
        background: #1e4a2a;
        color: #4caf50;
      }
      .tag.error {
        background: #4a1e1e;
        color: #e06c75;
      }
      .tag.progress {
        background: #1e3a4a;
        color: #4a9eff;
      }
      ul {
        list-style: none;
      }
      li {
        padding: 6px 0;
        border-bottom: 1px solid #333;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      li:last-child {
        border-bottom: none;
      }
      .flex {
        display: flex;
        gap: 12px;
      }
      .flex-1 {
        flex: 1;
      }
      .loading {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid #444;
        border-top-color: #4a9eff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .progress-bar {
        height: 4px;
        background: #333;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 4px;
      }
      .progress-bar .fill {
        height: 100%;
        background: #4a9eff;
        transition: width 0.3s ease;
        border-radius: 2px;
      }
      .empty {
        color: #666;
        font-style: italic;
        font-size: 13px;
        padding: 12px 0;
      }
      .repo-name {
        font-weight: 600;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>openp41ge-git Demo</h1>
    <p class="subtitle">Interactive demo using TestGitAdapter (in-memory, no real git backend)</p>

    <div class="flex">
      <div class="flex-1">
        <!-- Clone -->
        <div class="card" id="clone-section">
          <h2>Clone</h2>
          <div class="row">
            <input id="clone-url" type="text" placeholder="https://github.com/example/repo.git" />
            <button id="clone-btn">Clone</button>
          </div>
          <div id="clone-progress"></div>
        </div>

        <!-- Repos -->
        <div class="card">
          <h2>Repositories</h2>
          <div id="repo-list"><div class="empty">No repos. Clone one above.</div></div>
        </div>
      </div>

      <div class="flex-1">
        <!-- Selected repo details -->
        <div class="card">
          <h2>Repo Details</h2>
          <div id="repo-detail"><div class="empty">Select a repo to see details</div></div>
        </div>

        <!-- Branches -->
        <div class="card">
          <h2>Branches</h2>
          <div class="row">
            <input id="branch-name" type="text" placeholder="branch name" />
            <button id="add-branch-btn">Add Branch</button>
          </div>
          <div id="branch-list"><div class="empty">No branches</div></div>
        </div>

        <!-- Worktrees -->
        <div class="card">
          <h2>Worktrees</h2>
          <div class="row">
            <input id="wt-branch" type="text" placeholder="branch name" />
            <button id="add-wt-btn">Add Worktree</button>
          </div>
          <div id="wt-list"><div class="empty">No worktrees</div></div>
        </div>
      </div>
    </div>

    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
